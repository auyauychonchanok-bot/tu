<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    /* =========================================================
       1. GLOBAL RESET & AVATAR BIOLUMINESCENT STYLING
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Prompt', 'Chakra Petch', sans-serif, system-ui;
      background-color: #030814;
      color: #ffffff;
    }

    /* Background image layer with smooth gentle zoom animation */
    .bg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.8s ease-in-out;
      z-index: 1;
      animation: smoothZoom 18s ease-in-out infinite alternate; /* Smooth Gentle Zoom */
    }

    @keyframes smoothZoom {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.08); /* Gentle, subtle zoom effect */
      }
    }

    .bg-start {
      background-image: url('./a2.jpeg'), url('./a2.jpg'), linear-gradient(135deg, #091e3a 0%, #2f80ed 50%, #2d9ee0 100%);
    }

    .bg-game {
      background-image: url('./a1.jpeg'), url('./a1.jpg'), linear-gradient(135deg, #02111b 0%, #00334e 50%, #145374 100%);
      opacity: 0;
    }

    /* Falling Leaf/Particles Canvas Overlay */
    #leafCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Floating Creator Logo Top Center */
    .creator-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(1.35); /* Zoomed to clip white margins */
      width: 100px;
      height: 100px;
      z-index: 100;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.9));
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(0, 242, 254, 0.7);
    }

    /* Sound Mute Toggle Button */
    .sound-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(8, 20, 40, 0.75);
      border: 2px solid rgba(0, 242, 254, 0.6);
      color: #00f2fe;
      font-size: 22px;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.9);
    }

    /* App Screens Container */
    .screen-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    /* =========================================================
       2. GLASSMORPHISM AVATAR UI CARDS
       ========================================================= */
    .bio-card {
      background: rgba(6, 20, 38, 0.88);
      border: 3px solid rgba(0, 242, 254, 0.6);
      border-radius: 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 45px rgba(0, 242, 254, 0.4), inset 0 0 20px rgba(0, 242, 254, 0.2);
      padding: 32px 28px;
      width: 92%;
      max-width: 620px;
      text-align: center;
      position: relative;
      animation: floatGlow 4s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { box-shadow: 0 0 30px rgba(0, 242, 254, 0.35); }
      100% { box-shadow: 0 0 55px rgba(157, 78, 221, 0.6); }
    }

    .title-large {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #4facfe 50%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 22px;
      color: #e0aaff;
      text-shadow: 0 0 10px rgba(157, 78, 221, 0.8);
      margin-bottom: 28px;
    }

    .btn-glow {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9d4edd 100%);
      border: none;
      border-radius: 50px;
      color: #ffffff;

      font-size: 24px;
      font-weight: bold;
      cursor: pointer;

    }

    .btn-glow:active {

    /* =========================================================

    /* Extra Large Image Display Area for Grade 1 Kids */
    .question-image-large {

    .question-text {

      margin-bottom: 20px;
      line-height: 1.3;

      word-break: break-word;
    }

    .options-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-btn {
      background: rgba(10, 30, 60, 0.85);
      border: 3px solid rgba(0, 242, 254, 0.5);
      border-radius: 24px;
      padding: 20px 18px;
      color: #ffffff;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      width: 100%;
    }

    .option-btn:active {
      transform: scale(0.97);
      background: rgba(0, 242, 254, 0.35);
      border-color: #00f2fe;
    }

    .option-btn.correct {
      background: rgba(46, 204, 113, 0.55) !important;
      border-color: #2ecc71 !important;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.9) !important;
      transform: scale(1.02);
    }

    .option-btn.wrong {
      background: rgba(231, 76, 60, 0.55) !important;
      border-color: #e74c3c !important;
      box-shadow: 0 0 30px rgba(231, 76, 60, 0.9) !important;
      transform: scale(0.98);
    }

    /* =========================================================
       5. VICTORY / GAME OVER SCREEN
       ========================================================= */
    #endScreen {
      z-index: 30;
    }

    #fireworksCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;

    }

    .score-big {

    /* RESPONSIVE LANDSCAPE OPTIMIZATION */

      }

      }
    }
  </style>

<body>

  <!-- Background Image Layers with Smooth Breathe Animation -->

  <script>
    /* =========================================================
       1. UPBEAT & FUN WEB AUDIO API BGM SYNTHESIZER
       ========================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.bgmInterval = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, vol = 0.1) {
        if (this.isMuted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playClick() {
        this.playTone(600, 'sine', 0.08, 0.12);
      }

      playCorrect() {
        if (this.isMuted || !this.ctx) return;
        this.playTone(523.25, 'triangle', 0.12, 0.15); // C5
        setTimeout(() => this.playTone(659.25, 'triangle', 0.12, 0.15), 100); // E5
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.15), 200); // G5
      }

      playWrong() {
        if (this.isMuted || !this.ctx) return;
        this.playTone(220, 'sawtooth', 0.18, 0.15);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 120);
      }

      playVictory() {
        if (this.isMuted || !this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.3, 0.18), idx * 150);
        });
      }

      startBGM() {
        if (this.bgmInterval || this.isMuted) return;
        
        const melody = [
          { f: 523.25, d: 0.18 },
          { f: 659.25, d: 0.18 },
          { f: 783.99, d: 0.18 },
          { f: 1046.50, d: 0.22 },
          { f: 783.99, d: 0.18 },
          { f: 880.00, d: 0.18 },
          { f: 1046.50, d: 0.25 },
          { f: 659.25, d: 0.18 },
          { f: 587.33, d: 0.18 },
          { f: 659.25, d: 0.18 },
          { f: 783.99, d: 0.25 },
          { f: 523.25, d: 0.22 }
        ];

        const bass = [130.81, 164.81, 196.00, 164.81];
        let noteIdx = 0;

        this.bgmInterval = setInterval(() => {
          if (!this.isMuted && this.ctx) {
            const m = melody[noteIdx % melody.length];
            const b = bass[Math.floor(noteIdx / 2) % bass.length];

            this.playTone(m.f, 'triangle', m.d, 0.05);
            if (noteIdx % 2 === 0) {
              this.playTone(b, 'sine', 0.2, 0.04);
            }

            noteIdx = (noteIdx + 1) % melody.length;
          }
        }, 250);
      }

      stopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.isMuted) this.stopBGM();
        else this.startBGM();
        return this.isMuted;
      }
    }

    const sound = new SoundEngine();

    /* =========================================================
       2. QUESTION BANK WITH EXTRA LARGE GRAPHIC IMAGE ICONS
       ========================================================= */
    const MASTER_QUESTIONS = [
      {
        image: "🌳",

      {

      {

      },
      {

        question: "รถยนต์วิ่งบนถนน คืออะไรเอ่ย?",
        correct: "สิ่งที่มนุษย์สร้างขึ้น"
      },
      {
        image: "⛰️",
        question: "ภูเขาสูงใหญ่ คืออะไรเอ่ย?",
        correct: "สิ่งแวดล้อมตามธรรมชาติ"
      },
      {

        correct: "สิ่งที่มนุษย์สร้างขึ้น"
      },
      {

        question: "แสงอาทิตย์ยามเช้า คืออะไรเอ่ย?",
        correct: "สิ่งแวดล้อมตามธรรมชาติ"
      },
      {
        image: "✏️",

        correct: "สิ่งที่มนุษย์สร้างขึ้น"
      },
      {

    const OPTION_NATURAL = "🌲 สิ่งแวดล้อมตามธรรมชาติ";
    const OPTION_MANMADE = "🏫 สิ่งที่มนุษย์สร้างขึ้น";

    /* =========================================================
       3. GAME STATE MANAGEMENT & NODE POSITIONS
       ========================================================= */
    let currentLevel = 1;
    let score = 0;
    let questionsList = [];
    let nodeResults = Array(10).fill(null);

    const mapNodePositions = [
      { x: 0.15, y: 0.82 },
      { x: 0.32, y: 0.72 },
      { x: 0.22, y: 0.55 },
      { x: 0.40, y: 0.45 },
      { x: 0.60, y: 0.55 },

      { x: 0.85, y: 0.48 },

      { x: 0.50, y: 0.22 },
      { x: 0.30, y: 0.15 }
    ];

    let characterPos = { ...mapNodePositions[0] };
    let cameraZoom = 1.0;
    let isMoving = false;

    /* =========================================================
       4. LEAF PARTICLES CANVAS SYSTEM
       ========================================================= */
    const leafCanvas = document.getElementById('leafCanvas');
    const leafCtx = leafCanvas.getContext('2d');
    let leaves = [];

    function resizeLeafCanvas() {
      leafCanvas.width = window.innerWidth;
      leafCanvas.height = window.innerHeight;
    }

    function initLeaves() {
      leaves = [];
      for (let i = 0; i < 25; i++) {
        leaves.push({
          x: Math.random() * leafCanvas.width,
          y: Math.random() * leafCanvas.height,
          size: Math.random() * 8 + 6,
          speedY: Math.random() * 1.2 + 0.8,
          speedX: Math.sin(Math.random() * Math.PI) * 0.8,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 2,
          color: Math.random() > 0.5 ? 'rgba(0, 242, 254, 0.7)' : 'rgba(157, 78, 221, 0.7)'
        });
      }
    }

    function updateAndDrawLeaves() {
      leafCtx.clearRect(0, 0, leafCanvas.width, leafCanvas.height);
      leaves.forEach(l => {
        l.y += l.speedY;
        l.x += Math.sin(l.y * 0.02) * 0.5;
        l.angle += l.spin;

        if (l.y > leafCanvas.height + 20) {
          l.y = -20;
          l.x = Math.random() * leafCanvas.width;
        }

        leafCtx.save();
        leafCtx.translate(l.x, l.y);
        leafCtx.rotate((l.angle * Math.PI) / 180);
        leafCtx.fillStyle = l.color;
        leafCtx.shadowBlur = 8;
        leafCtx.shadowColor = l.color;
        
        leafCtx.beginPath();
        leafCtx.ellipse(0, 0, l.size, l.size / 2, 0, 0, Math.PI * 2);
        leafCtx.fill();
        leafCtx.restore();
      });
      requestAnimationFrame(updateAndDrawLeaves);
    }

    /* =========================================================
       5. MAP CANVAS & CAMERA ZOOM ENGINE
       ========================================================= */
    const mapCanvas = document.getElementById('mapCanvas');
    const mapCtx = mapCanvas.getContext('2d');

    function resizeMapCanvas() {
      mapCanvas.width = window.innerWidth;
      mapCanvas.height = window.innerHeight;
      drawMap();
    }

    function drawMap() {
      if (document.getElementById('mapScreen').classList.contains('hidden')) return;

      const w = mapCanvas.width;
      const h = mapCanvas.height;

      mapCtx.clearRect(0, 0, w, h);
      mapCtx.save();

      if (isMoving) {
        cameraZoom = 1.4;
      } else {
        cameraZoom = 1.0;
      }

      const focusX = characterPos.x * w;
      const focusY = characterPos.y * h;

      mapCtx.translate(w / 2, h / 2);
      mapCtx.scale(cameraZoom, cameraZoom);
      mapCtx.translate(-focusX, -focusY);

      // Draw Path
      mapCtx.beginPath();
      for (let i = 0; i < mapNodePositions.length; i++) {
        const nx = mapNodePositions[i].x * w;
        const ny = mapNodePositions[i].y * h;
        if (i === 0) mapCtx.moveTo(nx, ny);
        else mapCtx.lineTo(nx, ny);
      }
      mapCtx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
      mapCtx.lineWidth = 6;
      mapCtx.setLineDash([10, 8]);
      mapCtx.stroke();
      mapCtx.setLineDash([]);

      // Draw Nodes
      mapNodePositions.forEach((pos, idx) => {
        const nx = pos.x * w;
        const ny = pos.y * h;
        const res = nodeResults[idx];

        mapCtx.save();
        mapCtx.beginPath();
        mapCtx.arc(nx, ny, 24, 0, Math.PI * 2);

        if (res === 'correct') {
          mapCtx.fillStyle = '#2ecc71';
          mapCtx.shadowColor = '#2ecc71';
          mapCtx.shadowBlur = 20;
        } else if (res === 'wrong') {
          mapCtx.fillStyle = '#e74c3c';
          mapCtx.shadowColor = '#e74c3c';
          mapCtx.shadowBlur = 20;
        } else if (idx === currentLevel - 1) {
          mapCtx.fillStyle = '#00f2fe';
          mapCtx.shadowColor = '#00f2fe';
          mapCtx.shadowBlur = 25;
        } else {
          mapCtx.fillStyle = 'rgba(10, 30, 60, 0.85)';
          mapCtx.shadowColor = 'rgba(0, 242, 254, 0.3)';
          mapCtx.shadowBlur = 10;
        }

        mapCtx.fill();
        mapCtx.lineWidth = 3;
        mapCtx.strokeStyle = '#ffffff';
        mapCtx.stroke();

        mapCtx.fillStyle = '#ffffff';
        mapCtx.font = 'bold 20px Prompt, sans-serif';
        mapCtx.textAlign = 'center';
        mapCtx.textBaseline = 'middle';

        if (res === 'correct') {
          mapCtx.fillText('✅', nx, ny);
        } else if (res === 'wrong') {
          mapCtx.fillText('❌', nx, ny);
        } else {
          mapCtx.fillText(idx + 1, nx, ny);
        }
        mapCtx.restore();
      });

      // Draw Fairy
      const cx = characterPos.x * w;
      const cy = characterPos.y * h;

      mapCtx.save();
      mapCtx.beginPath();
      mapCtx.arc(cx, cy - 10, 22, 0, Math.PI * 2);
      mapCtx.fillStyle = 'rgba(0, 242, 254, 0.35)';
      mapCtx.shadowColor = '#00f2fe';
      mapCtx.shadowBlur = 25;
      mapCtx.fill();

      mapCtx.font = '36px sans-serif';
      mapCtx.textAlign = 'center';
      mapCtx.textBaseline = 'middle';
      mapCtx.fillText('🧚‍♂️', cx, cy - 10);

      mapCtx.restore();
      mapCtx.restore();
    }

    function animateCharacterToNode(targetIdx, onComplete) {
      isMoving = true;
      const startPos = { ...characterPos };
      const targetPos = mapNodePositions[targetIdx];
      const duration = 1200;
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const ease = progress < 0.5 
          ? 4 * progress * progress * progress 
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        characterPos.x = startPos.x + (targetPos.x - startPos.x) * ease;
        characterPos.y = startPos.y + (targetPos.y - startPos.y) * ease;

        drawMap();

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          characterPos = { ...targetPos };
          isMoving = false;
          drawMap();
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    /* =========================================================
       6. GAME FLOW & LOGIC
       ========================================================= */
    function shuffleArray(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function initGame() {
      currentLevel = 1;
      score = 0;
      nodeResults = Array(10).fill(null);
      questionsList = shuffleArray(MASTER_QUESTIONS);
      characterPos = { ...mapNodePositions[0] };
    }

    function showScreen(screenId) {
      const screens = ['startScreen', 'mapScreen', 'quizScreen', 'endScreen'];
      screens.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');

      if (screenId === 'startScreen') {
        document.getElementById('bgStart').style.opacity = '1';
        document.getElementById('bgGame').style.opacity = '0';
      } else {
        document.getElementById('bgStart').style.opacity = '0';
        document.getElementById('bgGame').style.opacity = '1';
      }

      if (screenId === 'mapScreen') {
        resizeMapCanvas();
      }
    }

    function startLevelDirectly(levelIdx) {
      showScreen('mapScreen');
      document.getElementById('mapLevelText').innerText = `ด่านที่ ${levelIdx}/10`;
      document.getElementById('mapScoreText').innerText = `คะแนน: ${score}`;
      drawMap();

      setTimeout(() => {
        loadQuiz(levelIdx);
      }, 500);
    }

    function loadQuiz(levelIdx) {
      showScreen('quizScreen');
      const q = questionsList[levelIdx - 1];

      document.getElementById('quizLevelBadge').innerText = `ด่านที่ ${levelIdx} / 10`;
      
      // Update Big Graphic Image for P.1
      document.getElementById('quizImageDisplay').innerText = q.image;
      document.getElementById('quizQuestionText').innerText = q.question;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const options = shuffleArray([OPTION_NATURAL, OPTION_MANMADE]);

      options.forEach(optText => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.setAttribute('data-text', optText);
        btn.onclick = () => handleAnswer(optText, q.correct, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedText, correctCategory, btnElement) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.style.pointerEvents = 'none');

      const isCorrect = (selectedText.includes("ธรรมชาติ") && correctCategory === "สิ่งแวดล้อมตามธรรมชาติ") ||
                        (selectedText.includes("มนุษย์สร้างขึ้น") && correctCategory === "สิ่งที่มนุษย์สร้างขึ้น");

      if (isCorrect) {
        btnElement.classList.add('correct');
        btnElement.innerText = "✅ " + selectedText;
        sound.playCorrect();
        score++;
        nodeResults[currentLevel - 1] = 'correct';
      } else {
        btnElement.classList.add('wrong');
        btnElement.innerText = "❌ " + selectedText;
        sound.playWrong();
        nodeResults[currentLevel - 1] = 'wrong';

        allBtns.forEach(b => {
          const rawText = b.getAttribute('data-text');
          if ((rawText.includes("ธรรมชาติ") && correctCategory === "สิ่งแวดล้อมตามธรรมชาติ") ||
              (rawText.includes("มนุษย์สร้างขึ้น") && correctCategory === "สิ่งที่มนุษย์สร้างขึ้น")) {
            b.classList.add('correct');
            b.innerText = "✅ " + rawText;
          }
        });
      }

      setTimeout(() => {
        if (currentLevel < 10) {
          showScreen('mapScreen');
          document.getElementById('mapScoreText').innerText = `คะแนน: ${score}`;
          
          animateCharacterToNode(currentLevel, () => {
            currentLevel++;
            document.getElementById('mapLevelText').innerText = `ด่านที่ ${currentLevel}/10`;
            setTimeout(() => {
              loadQuiz(currentLevel);
            }, 600);
          });
        } else {
          showEndScreen();
        }
      }, 1300);
    }

    function showEndScreen() {
      showScreen('endScreen');
      document.getElementById('endScore').innerText = `${score} / 10`;

      const endStatus = document.getElementById('endStatus');
      if (score >= 7) {
        endStatus.innerText = "🎉 เก่งมากเลย! ผ่านเกณฑ์แล้วครับ 🥳🎊";
        endStatus.style.color = "#00f2fe";
        sound.playVictory();
        startFireworks();
      } else {
        endStatus.innerText = "พยายามอีกนิดนะ! ลองใหม่อีกครั้ง 💪";
        endStatus.style.color = "#ff9f43";
      }
    }

    /* =========================================================
       7. FIREWORKS ENGINE FOR SCORE >= 7
       ========================================================= */
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let fireworksParticles = [];

    function startFireworks() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
      fireworksParticles = [];

      const colors = ['#00f2fe', '#9d4edd', '#2ecc71', '#ff9f43', '#ff5252', '#ffffff', '#ffd700'];
      
      for (let burst = 0; burst < 6; burst++) {
        const cx = Math.random() * (fwCanvas.width * 0.8) + fwCanvas.width * 0.1;
        const cy = Math.random() * (fwCanvas.height * 0.6) + fwCanvas.height * 0.1;
        
        for (let i = 0; i < 50; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 10 + 2;
          fireworksParticles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 5 + 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            decay: Math.random() * 0.015 + 0.008
          });
        }
      }
      animateFireworks();
    }

    function animateFireworks() {
      if (document.getElementById('endScreen').classList.contains('hidden')) return;
      
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      fireworksParticles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.alpha -= p.decay;

        fwCtx.save();
        fwCtx.globalAlpha = Math.max(p.alpha, 0);
        fwCtx.fillStyle = p.color;
        fwCtx.shadowBlur = 10;
        fwCtx.shadowColor = p.color;
        fwCtx.beginPath();
        fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fwCtx.fill();
        fwCtx.restore();

        if (p.alpha <= 0) {
          fireworksParticles.splice(idx, 1);
        }
      });

      if (fireworksParticles.length > 0) {
        requestAnimationFrame(animateFireworks);
      }
    }

    /* =========================================================
       8. INITIALIZATION & EVENT LISTENERS
       ========================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      resizeLeafCanvas();
      initLeaves();
      updateAndDrawLeaves();

      window.addEventListener('resize', () => {
        resizeLeafCanvas();
        resizeMapCanvas();
        if (fwCanvas) {
          fwCanvas.width = window.innerWidth;
          fwCanvas.height = window.innerHeight;
        }
      });

      document.body.addEventListener('click', () => sound.init(), { once: true });

      const soundToggleBtn = document.getElementById('soundToggle');
      soundToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.init();
        const muted = sound.toggleMute();
        soundToggleBtn.innerText = muted ? '🔇' : '🔊';
      });

      document.getElementById('startBtn').addEventListener('click', () => {
        sound.playClick();
        sound.startBGM();
        initGame();
        startLevelDirectly(1);
      });

      document.getElementById('restartBtn').addEventListener('click', () => {
        sound.playClick();
        initGame();
        startLevelDirectly(1);
      });
    });
  </script>
