<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ท่องโลกธรรมชาติ - สังคมศึกษา ป.1</title>
  <style>
    /* =========================================================
       1. GLOBAL RESET & STYLING
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Prompt', 'Chakra Petch', sans-serif, system-ui;
      background-color: #030814;
      color: #ffffff;
    }

    /* Background Layer with Edge-Locked Smooth Camera Scale */
    .bg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
      transform-origin: center center;
    }

    .bg-start {
      background-image: url('./a2.jpeg'), url('./a2.jpg'), linear-gradient(135deg, #091e3a 0%, #2f80ed 50%, #2d9ee0 100%);
    }

    .bg-game {
      background-image: url('./a1.jpeg'), url('./a1.jpg'), linear-gradient(135deg, #02111b 0%, #00334e 50%, #145374 100%);
      opacity: 0;
    }

    #leafCanvas, #ribbonCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #leafCanvas { z-index: 2; }
    #ribbonCanvas { z-index: 28; }

    /* Creator Logo (75x75px) */
    .creator-logo {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 75px;
      height: 75px;
      z-index: 100;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.9)) drop-shadow(0 0 20px rgba(157, 78, 221, 0.6));
    }

    .sound-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(8, 20, 40, 0.55);
      border: 2px solid rgba(0, 242, 254, 0.6);
      color: #00f2fe;
      font-size: 22px;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }

    .screen-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    /* =========================================================
       2. START SCREEN
       ========================================================= */
    .start-content-frameless {
      text-align: center;
      padding: 20px;
      animation: fadeInText 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes fadeInText {
      0% {
        opacity: 0;
        transform: translateY(25px) scale(0.92);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    .title-large {
      font-size: 52px;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #4facfe 50%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.8));
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 26px;
      color: #e0aaff;
      text-shadow: 0 0 15px rgba(157, 78, 221, 0.9), 0 2px 5px rgba(0,0,0,0.8);
      margin-bottom: 42px;
    }

    .btn-glow {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.9) 0%, rgba(79, 172, 254, 0.9) 50%, rgba(157, 78, 221, 0.9) 100%);
      border: none;
      border-radius: 50px;
      color: #ffffff;
      padding: 18px 48px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.8);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      transition: all 0.25s ease;
      display: inline-block;
    }

    .btn-glow:active {
      transform: scale(0.94);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.9);
    }

    .countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 110px;
      font-weight: 900;
      color: #00f2fe;
      text-shadow: 0 0 40px rgba(0, 242, 254, 1), 0 0 80px rgba(157, 78, 221, 0.9);
      z-index: 40;
      animation: pulseCount 0.9s infinite alternate;
    }

    @keyframes pulseCount {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.25); }
    }

    /* =========================================================
       3. MAP SCREEN & HUD
       ========================================================= */
    #mapScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 15;
      overflow: hidden;
    }

    #mapCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-header-hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 20;
      display: flex;
      gap: 12px;
    }

    .hud-badge {
      background: rgba(6, 20, 38, 0.55);
      border: 2px solid rgba(0, 242, 254, 0.6);
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #00f2fe;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    /* =========================================================
       4. QUIZ SCREEN, WRONG POPUP ❌ & CORRECT POPUP 👍
       ========================================================= */
    #quizScreen {
      z-index: 25;
      padding: 10px;
    }

    .bio-card {
      background: rgba(6, 20, 38, 0.42);
      border: 2px solid rgba(0, 242, 254, 0.7);
      border-radius: 32px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.3);
      padding: 24px 20px;
      width: 96%;
      max-width: 780px;
      max-height: 94vh;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Medium Sized Popup Overlay Base */
    .feedback-popup-badge {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 28px;
      border-radius: 35px;
    }

    .feedback-popup-badge.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Wrong Popup ❌ */
    .wrong-popup {
      color: #e74c3c;
      background: rgba(20, 5, 10, 0.92);
      border: 4px solid #e74c3c;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      font-size: 85px;
      box-shadow: 0 0 35px rgba(231, 76, 60, 0.9);
    }

    .wrong-popup.active {
      animation: wrongShake 0.4s ease-in-out;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      20% { transform: translate(-55%, -50%) scale(1) rotate(-8deg); }
      40% { transform: translate(-45%, -50%) scale(1) rotate(8deg); }
      60% { transform: translate(-53%, -50%) scale(1) rotate(-5deg); }
      80% { transform: translate(-47%, -50%) scale(1) rotate(5deg); }
    }

    /* Medium Sized Correct Popup "เย้ ถูกต้องค่ะ👍" */
    .correct-popup {
      color: #2ecc71;
      background: rgba(5, 30, 15, 0.92);
      border: 4px solid #2ecc71;
      box-shadow: 0 0 40px rgba(46, 204, 113, 0.95);
      min-width: 280px;
    }

    .correct-popup.active {
      animation: correctBounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes correctBounce {
      0% { transform: translate(-50%, -50%) scale(0.3); }
      60% { transform: translate(-50%, -50%) scale(1.15); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .correct-popup-text {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(46, 204, 113, 0.9);
      white-space: nowrap;
    }

    .correct-popup-icon {
      font-size: 48px;
      margin-top: 4px;
    }

    .question-badge {
      background: rgba(157, 78, 221, 0.4);
      border: 2px solid #9d4edd;
      color: #f3e8ff;
      border-radius: 16px;
      padding: 4px 20px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-image-large {
      font-size: 120px;
      line-height: 1;
      margin: 8px 0 14px 0;
      filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.9));
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.7)); }
      100% { transform: scale(1.06); filter: drop-shadow(0 0 30px rgba(224, 170, 255, 0.95)); }
    }

    .question-text {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 242, 254, 0.6);
      word-break: break-word;
    }

    .options-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-btn {
      background: rgba(8, 25, 50, 0.55);
      border: 2px solid rgba(0, 242, 254, 0.6);
      border-radius: 24px;
      padding: 20px 18px;
      color: #ffffff;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 100%;
    }

    .option-btn.correct {
      background: rgba(46, 204, 113, 0.75) !important;
      border-color: #2ecc71 !important;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.9) !important;
      transform: scale(1.02);
    }

    .option-btn.wrong {
      background: rgba(231, 76, 60, 0.75) !important;
      border-color: #e74c3c !important;
      box-shadow: 0 0 30px rgba(231, 76, 60, 0.9) !important;
      transform: scale(0.98);
    }

    /* =========================================================
       5. VICTORY / END SCREEN
       ========================================================= */
    #endScreen { z-index: 30; }

    #fireworksCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 29;
    }

    .title-large-end {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.25;
      background: linear-gradient(180deg, #ffffff 0%, #4facfe 50%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.8));
      margin-bottom: 10px;
      word-break: break-word;
    }

    .score-big {
      font-size: 64px;
      font-weight: 800;
      color: #00f2fe;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.9);
      margin: 12px 0;
    }

    .result-status {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 24px;
      word-break: break-word;
    }

    @media screen and (max-height: 550px) {
      .creator-logo { width: 55px; height: 55px; }
      .title-large { font-size: 34px; }
      .title-large-end { font-size: 28px; }
      .subtitle { font-size: 18px; margin-bottom: 20px; }
      .question-image-large { font-size: 70px; margin: 2px 0; }
      .question-text { font-size: 20px; margin-bottom: 10px; }
      .option-btn { padding: 10px 14px; font-size: 18px; }
      .wrong-popup { width: 100px; height: 100px; font-size: 60px; }
      .correct-popup-text { font-size: 24px; }
      .correct-popup-icon { font-size: 36px; }
    }
  </style>
</head>
<body>

  <!-- Background Image Layers -->
  <div id="bgStart" class="bg-layer bg-start"></div>
  <div id="bgGame" class="bg-layer bg-game"></div>

  <!-- Canvas FX Layers -->
  <canvas id="leafCanvas"></canvas>
  <canvas id="ribbonCanvas"></canvas>

  <!-- Creator Logo (75x75px) -->
  <img src="t.png" alt="Creator Logo" class="creator-logo" onerror="this.style.display='none'">

  <!-- Sound Toggle -->
  <button id="soundToggle" class="sound-btn" title="เปิด/ปิดเสียง">🔊</button>

  <!-- Countdown Overlay for 3s Delay -->
  <div id="countdownOverlay" class="countdown-overlay hidden">3</div>

  <!-- =========================================================
       SCREEN 1: START SCREEN
       ========================================================= -->
  <div id="startScreen" class="screen-container">
    <div class="start-content-frameless">
      <div class="title-large">ท่องโลกธรรมชาติ</div>
      <div class="subtitle">วิชาสังคมศึกษา ระดับชั้น ป.1</div>

    </div>
  </div>

  <!-- =========================================================
       SCREEN 2: MAP SCREEN
       ========================================================= -->
  <div id="mapScreen" class="screen-container hidden">
    <div class="map-header-hud">
      <div class="hud-badge" id="mapLevelText">ด่านที่ 1/10</div>
      <div class="hud-badge" id="mapScoreText">คะแนน: 0</div>
    </div>
    <canvas id="mapCanvas"></canvas>
  </div>

  <!-- =========================================================
       SCREEN 3: QUIZ QUESTION SCREEN
       ========================================================= -->
  <div id="quizScreen" class="screen-container hidden">
    <div class="bio-card">
      <!-- Medium Sized Wrong Popup ❌ Overlay -->
      <div id="wrongPopup" class="feedback-popup-badge wrong-popup">❌</div>

      <!-- Medium Sized Correct Popup "เย้ ถูกต้องค่ะ👍" Overlay -->
      <div id="correctPopup" class="feedback-popup-badge correct-popup">
        <div class="correct-popup-text">เย้ ถูกต้องค่ะ</div>

      </div>

      <div class="question-badge" id="quizLevelBadge">ด่านที่ 1 / 10</div>

      <div class="options-grid" id="optionsContainer"></div>
    </div>
  </div>

  <!-- =========================================================
       SCREEN 4: GAME OVER / VICTORY SCREEN
       ========================================================= -->
  <div id="endScreen" class="screen-container hidden">
    <canvas id="fireworksCanvas"></canvas>
    <div class="bio-card" style="z-index: 31;">
      <div class="title-large-end" id="endTitle">เย้ ยินดีด้วยค่ะ เด็กๆเก่งมาก</div>
      <div class="score-big" id="endScore">0 / 10</div>
      <div class="result-status" id="endStatus" style="display: none;"></div>
      <button id="restartBtn" class="btn-glow">🔄 เล่นอีกครั้ง</button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. WEB AUDIO API SYNTHESIZER
       ========================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.bgmInterval = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, vol = 0.1) {
        if (this.isMuted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playClick() { this.playTone(600, 'sine', 0.08, 0.12); }

      playCorrect() {
        if (this.isMuted || !this.ctx) return;
        this.playTone(523.25, 'triangle', 0.12, 0.15);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.12, 0.15), 100);
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.15), 200);
      }

      playWrong() {
        if (this.isMuted || !this.ctx) return;
        this.playTone(220, 'sawtooth', 0.18, 0.15);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 120);
      }

      playVictory() {
        if (this.isMuted || !this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.3, 0.18), idx * 150);
        });
      }

      startBGM() {
        if (this.bgmInterval || this.isMuted) return;
        const melody = [
          { f: 523.25, d: 0.18 }, { f: 659.25, d: 0.18 }, { f: 783.99, d: 0.18 },
          { f: 1046.50, d: 0.22 }, { f: 783.99, d: 0.18 }, { f: 880.00, d: 0.18 },
          { f: 1046.50, d: 0.25 }, { f: 659.25, d: 0.18 }, { f: 587.33, d: 0.18 },
          { f: 659.25, d: 0.18 }, { f: 783.99, d: 0.25 }, { f: 523.25, d: 0.22 }
        ];
        const bass = [130.81, 164.81, 196.00, 164.81];
        let noteIdx = 0;

        this.bgmInterval = setInterval(() => {
          if (!this.isMuted && this.ctx) {
            const m = melody[noteIdx % melody.length];
            const b = bass[Math.floor(noteIdx / 2) % bass.length];
            this.playTone(m.f, 'triangle', m.d, 0.05);
            if (noteIdx % 2 === 0) this.playTone(b, 'sine', 0.2, 0.04);
            noteIdx = (noteIdx + 1) % melody.length;
          }
        }, 250);
      }

      stopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.isMuted) this.stopBGM();
        else this.startBGM();
        return this.isMuted;
      }
    }

    const sound = new SoundEngine();

    /* =========================================================
       2. QUESTION BANK
       ========================================================= */
    const MASTER_QUESTIONS = [
      { image: "🌳", question: "ต้นไม้ใหญ่ในป่า คืออะไรเอ่ย?", correct: "สิ่งแวดล้อมตามธรรมชาติ" },
      { image: "🏠", question: "บ้านที่เราอยู่อาศัย คืออะไรเอ่ย?", correct: "สิ่งที่มนุษย์สร้างขึ้น" },
      { image: "💧", question: "น้ำใสในลำธาร คืออะไรเอ่ย?", correct: "สิ่งแวดล้อมตามธรรมชาติ" },
      { image: "🚗", question: "รถยนต์วิ่งบนถนน คืออะไรเอ่ย?", correct: "สิ่งที่มนุษย์สร้างขึ้น" },
      { image: "⛰️", question: "ภูเขาสูงใหญ่ คืออะไรเอ่ย?", correct: "สิ่งแวดล้อมตามธรรมชาติ" },
      { image: "🏫", question: "โรงเรียนของเรา คืออะไรเอ่ย?", correct: "สิ่งที่มนุษย์สร้างขึ้น" },
      { image: "☀️", question: "แสงอาทิตย์ยามเช้า คืออะไรเอ่ย?", correct: "สิ่งแวดล้อมตามธรรมชาติ" },
      { image: "✏️", question: "ดินสอเขียนหนังสือ คืออะไรเอ่ย?", correct: "สิ่งที่มนุษย์สร้างขึ้น" },
      { image: "💨", question: "อากาศสดชื่นใช้หายใจ คืออะไรเอ่ย?", correct: "สิ่งแวดล้อมตามธรรมชาติ" },
      { image: "🌱", question: "ดินสำหรับปลูกพืช คืออะไรเอ่ย?", correct: "สิ่งแวดล้อมตามธรรมชาติ" }
    ];

    const OPTION_NATURAL = "🌲 สิ่งแวดล้อมตามธรรมชาติ";
    const OPTION_MANMADE = "🏫 สิ่งที่มนุษย์สร้างขึ้น";

    /* =========================================================
       3. GAME STATE & NODE POSITIONS
       ========================================================= */
    let currentLevel = 1;
    let score = 0;
    let questionsList = [];
    let nodeResults = Array(10).fill(null);

    const mapNodePositions = [
      { x: 0.15, y: 0.82 }, { x: 0.32, y: 0.72 },
      { x: 0.22, y: 0.55 }, { x: 0.40, y: 0.45 },
      { x: 0.60, y: 0.55 }, { x: 0.78, y: 0.68 },
      { x: 0.85, y: 0.48 }, { x: 0.70, y: 0.32 },
      { x: 0.50, y: 0.22 }, { x: 0.30, y: 0.15 }
    ];

    let characterPos = { ...mapNodePositions[0] };
    let cameraZoom = 1.0;
    let isMoving = false;

    /* =========================================================
       4. LEAVES, RIBBON & FIREWORKS CANVAS SYSTEM
       ========================================================= */
    const leafCanvas = document.getElementById('leafCanvas');
    const leafCtx = leafCanvas.getContext('2d');
    let leaves = [];

    function resizeLeafCanvas() {
      leafCanvas.width = window.innerWidth;
      leafCanvas.height = window.innerHeight;
    }

    function initLeaves() {
      leaves = [];
      for (let i = 0; i < 25; i++) {
        leaves.push({
          x: Math.random() * leafCanvas.width,
          y: Math.random() * leafCanvas.height,
          size: Math.random() * 8 + 6,
          speedY: Math.random() * 1.2 + 0.8,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 2,
          color: Math.random() > 0.5 ? 'rgba(0, 242, 254, 0.7)' : 'rgba(157, 78, 221, 0.7)'
        });
      }
    }

    function updateAndDrawLeaves() {
      leafCtx.clearRect(0, 0, leafCanvas.width, leafCanvas.height);
      leaves.forEach(l => {
        l.y += l.speedY;
        l.angle += l.spin;
        if (l.y > leafCanvas.height + 20) {
          l.y = -20;
          l.x = Math.random() * leafCanvas.width;
        }
        leafCtx.save();
        leafCtx.translate(l.x, l.y);
        leafCtx.rotate((l.angle * Math.PI) / 180);
        leafCtx.fillStyle = l.color;
        leafCtx.beginPath();
        leafCtx.ellipse(0, 0, l.size, l.size / 2, 0, 0, Math.PI * 2);
        leafCtx.fill();
        leafCtx.restore();
      });
      requestAnimationFrame(updateAndDrawLeaves);
    }

    /* Falling Ribbon FX */
    const ribbonCanvas = document.getElementById('ribbonCanvas');
    const ribbonCtx = ribbonCanvas.getContext('2d');
    let ribbons = [];

    function triggerRibbons() {
      ribbonCanvas.width = window.innerWidth;
      ribbonCanvas.height = window.innerHeight;
      ribbons = [];

      const colors = ['#00f2fe', '#2ecc71', '#ff9f43', '#e74c3c', '#9d4edd', '#ffd700', '#ff6b6b'];
      for (let i = 0; i < 90; i++) {
        ribbons.push({
          x: Math.random() * ribbonCanvas.width,
          y: -Math.random() * 200,
          w: Math.random() * 10 + 6,
          h: Math.random() * 16 + 10,
          speedY: Math.random() * 6 + 4,
          speedX: (Math.random() - 0.5) * 3,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 10,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      animateRibbons();
    }

    function animateRibbons() {
      ribbonCtx.clearRect(0, 0, ribbonCanvas.width, ribbonCanvas.height);
      let activeCount = 0;

      ribbons.forEach(r => {
        r.y += r.speedY;
        r.x += Math.sin(r.y * 0.05) * 2 + r.speedX;
        r.angle += r.spin;

        if (r.y < ribbonCanvas.height + 30) {
          activeCount++;
          ribbonCtx.save();
          ribbonCtx.translate(r.x, r.y);
          ribbonCtx.rotate((r.angle * Math.PI) / 180);
          ribbonCtx.fillStyle = r.color;
          ribbonCtx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h);
          ribbonCtx.restore();
        }
      });

      if (activeCount > 0) {
        requestAnimationFrame(animateRibbons);
      }
    }

    /* Continuous Full-Screen Fireworks Engine */
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let fwParticles = [];
    let isFireworksRunning = false;
    let fwTimer = null;

    function createFireworkBurst() {
      const cx = Math.random() * (fwCanvas.width * 0.85) + fwCanvas.width * 0.075;
      const cy = Math.random() * (fwCanvas.height * 0.55) + fwCanvas.height * 0.1;
      const colors = ['#00f2fe', '#2ecc71', '#ffd700', '#ff9f43', '#e74c3c', '#9d4edd', '#ffffff'];

      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        fwParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }
    }

    function startContinuousFireworks() {
      stopContinuousFireworks();
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
      fwParticles = [];
      isFireworksRunning = true;

      for (let i = 0; i < 4; i++) {
        createFireworkBurst();
      }

      fwTimer = setInterval(() => {
        if (isFireworksRunning) {
          createFireworkBurst();
        }
      }, 400);

      animateFireworksLoop();
    }

    function stopContinuousFireworks() {
      isFireworksRunning = false;
      if (fwTimer) {
        clearInterval(fwTimer);
        fwTimer = null;
      }
      fwParticles = [];
      if (fwCtx) {
        fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      }
    }

    function animateFireworksLoop() {
      if (!isFireworksRunning) return;

      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      fwParticles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.alpha -= p.decay;

        if (p.alpha > 0) {
          fwCtx.save();
          fwCtx.globalAlpha = p.alpha;
          fwCtx.fillStyle = p.color;
          fwCtx.shadowBlur = 10;
          fwCtx.shadowColor = p.color;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          fwCtx.fill();
          fwCtx.restore();
        } else {
          fwParticles.splice(idx, 1);
        }
      });

      requestAnimationFrame(animateFireworksLoop);
    }

    /* =========================================================
       5. MAP CANVAS & SMOOTH EDGE-LOCKED BACKGROUND CAMERA PANNING
       ========================================================= */
    const mapCanvas = document.getElementById('mapCanvas');
    const mapCtx = mapCanvas.getContext('2d');

    function resizeMapCanvas() {
      mapCanvas.width = window.innerWidth;
      mapCanvas.height = window.innerHeight;
      drawMap();
    }

    function updateBackgroundCamera(normX, normY) {
      const bgGame = document.getElementById('bgGame');
      if (!bgGame) return;

      const maxScale = 1.18;
      const moveX = (0.5 - normX) * 12;
      const moveY = (0.5 - normY) * 12;

      bgGame.style.transform = `scale(${maxScale}) translate(${moveX}px, ${moveY}px)`;
    }

    function drawMap() {
      if (document.getElementById('mapScreen').classList.contains('hidden')) return;

      const w = mapCanvas.width;
      const h = mapCanvas.height;
      mapCtx.clearRect(0, 0, w, h);
      mapCtx.save();

      cameraZoom = isMoving ? 1.35 : 1.0;
      const focusX = characterPos.x * w;
      const focusY = characterPos.y * h;

      updateBackgroundCamera(characterPos.x, characterPos.y);

      mapCtx.translate(w / 2, h / 2);
      mapCtx.scale(cameraZoom, cameraZoom);
      mapCtx.translate(-focusX, -focusY);

      // Path
      mapCtx.beginPath();
      mapNodePositions.forEach((pos, i) => {
        const nx = pos.x * w, ny = pos.y * h;
        if (i === 0) mapCtx.moveTo(nx, ny);
        else mapCtx.lineTo(nx, ny);
      });
      mapCtx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
      mapCtx.lineWidth = 6;
      mapCtx.setLineDash([10, 8]);
      mapCtx.stroke();

      // Nodes
      mapNodePositions.forEach((pos, idx) => {
        const nx = pos.x * w, ny = pos.y * h;
        const res = nodeResults[idx];

        mapCtx.save();
        mapCtx.beginPath();
        mapCtx.arc(nx, ny, 24, 0, Math.PI * 2);

        if (res === 'correct') {
          mapCtx.fillStyle = '#2ecc71';
        } else if (res === 'wrong') {
          mapCtx.fillStyle = '#e74c3c';
        } else if (idx === currentLevel - 1) {
          mapCtx.fillStyle = '#00f2fe';
        } else {
          mapCtx.fillStyle = 'rgba(10, 30, 60, 0.85)';
        }

        mapCtx.fill();
        mapCtx.strokeStyle = '#ffffff';
        mapCtx.lineWidth = 3;
        mapCtx.stroke();

        mapCtx.fillStyle = '#ffffff';
        mapCtx.font = 'bold 20px Prompt';
        mapCtx.textAlign = 'center';
        mapCtx.textBaseline = 'middle';

        if (res === 'correct') mapCtx.fillText('✅', nx, ny);
        else if (res === 'wrong') mapCtx.fillText('❌', nx, ny);
        else mapCtx.fillText(idx + 1, nx, ny);

        mapCtx.restore();
      });

      // Fairy Character
      const cx = characterPos.x * w, cy = characterPos.y * h;
      mapCtx.save();
      mapCtx.font = '36px sans-serif';
      mapCtx.textAlign = 'center';
      mapCtx.textBaseline = 'middle';
      mapCtx.fillText('🧚‍♂️', cx, cy - 10);
      mapCtx.restore();

      mapCtx.restore();
    }

    function animateCharacterToNode(targetIdx, onComplete) {
      isMoving = true;
      const startPos = { ...characterPos };
      const targetPos = mapNodePositions[targetIdx];
      const duration = 1200;
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        characterPos.x = startPos.x + (targetPos.x - startPos.x) * ease;
        characterPos.y = startPos.y + (targetPos.y - startPos.y) * ease;
        drawMap();

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          characterPos = { ...targetPos };
          isMoving = false;
          drawMap();
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    /* =========================================================
       6. GAME FLOW
       ========================================================= */
    function shuffleArray(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function initGame() {
      stopContinuousFireworks();
      currentLevel = 1;
      score = 0;
      nodeResults = Array(10).fill(null);
      questionsList = shuffleArray(MASTER_QUESTIONS);
      characterPos = { ...mapNodePositions[0] };
    }

    function showScreen(screenId) {
      ['startScreen', 'mapScreen', 'quizScreen', 'endScreen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');

      if (screenId === 'startScreen') {
        document.getElementById('bgStart').style.opacity = '1';
        document.getElementById('bgGame').style.opacity = '0';
      } else {
        document.getElementById('bgStart').style.opacity = '0';
        document.getElementById('bgGame').style.opacity = '1';
      }

      if (screenId === 'mapScreen') resizeMapCanvas();
    }

    function startWithDelay() {
      showScreen('mapScreen');
      const countEl = document.getElementById('countdownOverlay');
      countEl.classList.remove('hidden');
      let timeLeft = 3;
      countEl.innerText = timeLeft;

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          countEl.innerText = timeLeft;
        } else {
          clearInterval(timer);
          countEl.classList.add('hidden');
          startLevelDirectly(1);
        }
      }, 1000);
    }

    function startLevelDirectly(levelIdx) {
      showScreen('mapScreen');
      document.getElementById('mapLevelText').innerText = `ด่านที่ ${levelIdx}/10`;
      document.getElementById('mapScoreText').innerText = `คะแนน: ${score}`;
      drawMap();

      setTimeout(() => {
        loadQuiz(levelIdx);
      }, 500);
    }

    function loadQuiz(levelIdx) {
      showScreen('quizScreen');
      const q = questionsList[levelIdx - 1];

      document.getElementById('wrongPopup').classList.remove('active');
      document.getElementById('correctPopup').classList.remove('active');

      document.getElementById('quizLevelBadge').innerText = `ด่านที่ ${levelIdx} / 10`;
      document.getElementById('quizImageDisplay').innerText = q.image;
      document.getElementById('quizQuestionText').innerText = q.question;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const options = shuffleArray([OPTION_NATURAL, OPTION_MANMADE]);

      options.forEach(optText => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.setAttribute('data-text', optText);
        btn.onclick = () => handleAnswer(optText, q.correct, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedText, correctCategory, btnElement) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.style.pointerEvents = 'none');

      const isCorrect = (selectedText.includes("ธรรมชาติ") && correctCategory === "สิ่งแวดล้อมตามธรรมชาติ") ||
                        (selectedText.includes("มนุษย์สร้างขึ้น") && correctCategory === "สิ่งที่มนุษย์สร้างขึ้น");

      if (isCorrect) {
        btnElement.classList.add('correct');
        btnElement.innerText = "ถูกต้อง✅ " + selectedText;
        
        // Trigger Medium Sized "เย้ ถูกต้องค่ะ👍" Overlay Popup
        const correctPopup = document.getElementById('correctPopup');
        correctPopup.classList.add('active');

        sound.playCorrect();
        triggerRibbons();
        score++;
        nodeResults[currentLevel - 1] = 'correct';
      } else {
        btnElement.classList.add('wrong');
        btnElement.innerText = "ตอบผิด❌ " + selectedText;
        
        // Trigger Medium Sized ❌ Overlay Popup
        const wrongPopup = document.getElementById('wrongPopup');
        wrongPopup.classList.add('active');

        sound.playWrong();
        nodeResults[currentLevel - 1] = 'wrong';
      }

      setTimeout(() => {
        document.getElementById('wrongPopup').classList.remove('active');
        document.getElementById('correctPopup').classList.remove('active');

        if (currentLevel < 10) {
          showScreen('mapScreen');
          document.getElementById('mapScoreText').innerText = `คะแนน: ${score}`;
          
          animateCharacterToNode(currentLevel, () => {
            currentLevel++;
            document.getElementById('mapLevelText').innerText = `ด่านที่ ${currentLevel}/10`;
            setTimeout(() => {
              loadQuiz(currentLevel);
            }, 600);
          });
        } else {
          showEndScreen();
        }
      }, 1600);
    }

    function showEndScreen() {
      showScreen('endScreen');
      document.getElementById('endScore').innerText = `${score} / 10`;

      const endTitle = document.getElementById('endTitle');
      const endStatus = document.getElementById('endStatus');

      if (score > 7) {
        endTitle.innerText = "เย้ ยินดีด้วยค่ะ เด็กๆเก่งมาก 🥳🎉";
        endStatus.style.display = "none"; // ซ่อนบรรทัดผ่านเกณฑ์ตามคำขอ
        sound.playVictory();
        triggerRibbons();
        startContinuousFireworks();
      } else {
        stopContinuousFireworks();
        endTitle.innerText = "ไม่เป็นไรนะ พยายามใหม่ สู้ๆ 💪";
        endStatus.style.display = "block";
        endStatus.innerText = "ลองตั้งใจฟังข้อถามแล้วตอบใหม่อีกครั้งนะ";
        endStatus.style.color = "#ff9f43";
      }
    }

    /* =========================================================
       7. INITIALIZATION & LISTENERS
       ========================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      resizeLeafCanvas();
      initLeaves();
      updateAndDrawLeaves();

      window.addEventListener('resize', () => {
        resizeLeafCanvas();
        resizeMapCanvas();
        if (isFireworksRunning) {
          fwCanvas.width = window.innerWidth;
          fwCanvas.height = window.innerHeight;
        }
      });

      document.body.addEventListener('click', () => sound.init(), { once: true });

      const soundToggleBtn = document.getElementById('soundToggle');
      soundToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.init();
        const muted = sound.toggleMute();
        soundToggleBtn.innerText = muted ? '🔇' : '🔊';
      });

      document.getElementById('startBtn').addEventListener('click', () => {
        sound.playClick();
        sound.startBGM();
        initGame();
        startWithDelay();
      });

      document.getElementById('restartBtn').addEventListener('click', () => {
        sound.playClick();
        initGame();
        startWithDelay();
      });
    });
  </script>
</body>
</html>
